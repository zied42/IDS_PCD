version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: ids_db
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ids_platform
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: ids_backend
    environment:
      - DATABASE_URL=mysql+pymysql://root:root@db:3306/ids_platform
      - FLASK_ENV=production
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Mount the parent directory folders to access ML models and datasets
      - ../archive:/archive
      - ../ml_corr_drop:/ml_corr_drop
      - ../dl_corr_drop:/dl_corr_drop
    # Wait for DB to be fully ready, seed database, then start gunicorn
    command: >
      sh -c "python seed.py && gunicorn -b 0.0.0.0:5000 --workers 2 --timeout 120 --access-logfile - --error-logfile - 'app:create_app()'"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: ids_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  simulator:
    build: ./backend
    container_name: ids_simulator
    environment:
      - API_URL=http://backend:5000
      - CSV_PATH=/archive/full_df_binary_labels.csv
    depends_on:
      - backend
    volumes:
      - ../archive:/archive
    command: >
      sh -c "sleep 10 && python simulator.py"
    profiles:
      - sim

volumes:
  db_data:
